short_bio: >-
  <p>
    Hi! I am <strong>Xinxin Li</strong>, a Ph.D. student in Applied Mathematics at
    <strong>East China Normal University</strong>.
    My research focuses on <strong>AI for scientific discovery</strong>, especially
    <strong>symbolic regression</strong>, <strong>partial differential equation (PDE) discovery</strong>,
    and <strong>symmetry discovery</strong>.
  </p>

  <p>
    I develop methods that combine neural networks with symbolic representations to uncover
    interpretable mathematical laws from data. My recent work explores compact symbolic models
    with Transformer-guided structure search (UniSymNet), the discovery of governing PDEs from
    sparse and noisy observations using weak formulations (Weak-PDE-Net), and adaptive symbolic
    libraries for discovering explicit Lie symmetries (LieDiscover).
  </p>

